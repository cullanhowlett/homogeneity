class: KaiserTracerCorrelationDimension

params:
  b1:
    prior:
      limits: [0., 10.]
    ref:
      limits: [1., 2.]
    latex: b_{1}
  sigmapar:
    prior:
      limits: [0., 30]
    ref:
      dist: norm
      loc: 5.
      scale: 2.
    latex: \Sigma_{\parallel}
  sigmaper:
    prior:
      limits: [0., 30]
    ref:
      dist: norm
      loc: 5.
      scale: 2.
    latex: \Sigma_{\perp}
  RH:
    derived: True
    latex: R_{H}
